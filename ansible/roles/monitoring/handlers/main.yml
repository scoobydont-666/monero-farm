---
- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: restart monerod-exporter
  ansible.builtin.systemd:
    name: monerod-exporter
    state: restarted

- name: restart unified-exporter
  ansible.builtin.systemd:
    name: p2pool-exporter
    # task-18040: governed by exporters_run_enabled, like its enforce task.
    state: "{{ 'restarted' if exporters_run_enabled | default(false) | bool else 'stopped' }}"

- name: restart observer-exporter
  ansible.builtin.systemd:
    name: p2pool-observer-exporter
    # task-18040: governed by exporters_run_enabled, like its enforce task.
    state: "{{ 'restarted' if exporters_run_enabled | default(false) | bool else 'stopped' }}"

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
